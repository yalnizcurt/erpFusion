name: Quality and migration verification

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: erpfusion_test
          POSTGRES_USER: erpfusion_test
          POSTGRES_PASSWORD: ci-fixture-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U erpfusion_test -d erpfusion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DEBUG: "false"
      LLM_PROVIDER: mock
      DEMO_MODE: "true"
      GROQ_API_KEY: ""
      ERP_ADMIN_API_KEY: ""
      DATABASE_URL: postgresql+asyncpg://erpfusion_test:ci-fixture-only@127.0.0.1:5432/erpfusion_test
      TEST_POSTGRES_URL: postgresql+asyncpg://erpfusion_test:ci-fixture-only@127.0.0.1:5432/erpfusion_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked backend and quality tools
        run: |
          python -m pip install uv==0.11.17
          uv sync --locked --extra dev --extra aws
      - name: Reject new lint and type debt
        run: uv run --no-sync python scripts/check_quality.py
      - name: Run backend regressions and real PostgreSQL fresh/legacy upgrades
        run: uv run --no-sync pytest -q --junitxml=test-results/backend.xml
      - name: Export test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-results
          path: backend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check types, lint, unit regressions and production build
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Install the locked Chromium test browser
        run: npx playwright install --with-deps chromium
      - name: Verify fixed shell and JSON viewport regressions
        run: npm run test:e2e
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the locked API for offline onboarding acceptance
        working-directory: backend
        run: |
          python -m pip install uv==0.11.17
          uv sync --locked
      - name: Verify UI-only ERP onboarding against the real API and worker
        run: npm run test:e2e:fullstack
      - name: Export browser verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-test-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
