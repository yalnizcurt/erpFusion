services:
  - type: web
    name: erpfusion-api
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    rootDir: backend
    buildCommand: pip install .
    preDeployCommand: DATABASE_URL=$MIGRATION_DATABASE_URL alembic upgrade head
    # The disk is available only at runtime. Provision storage outside the app lifecycle.
    startCommand: mkdir -p /var/data/artifacts && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    disk:
      name: erpfusion-assets
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DEMO_MODE
        value: false
      - key: ARTIFACT_STORAGE_PATH
        value: /var/data/artifacts
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: erpfusion-db
          property: connectionString
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: AUTH_MODE
        value: oidc
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_AUDIENCE
        sync: false
      - key: OIDC_JWKS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: erpfusion-db
    databaseName: erpfusion
    user: erpfusion
    plan: 0.5c-1g
    region: singapore
    diskSizeGB: 5
