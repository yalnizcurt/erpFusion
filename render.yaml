services:
  - type: web
    name: erpfusion-api
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: erpfusion-assets
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ARTIFACT_STORAGE_PATH
        value: /var/data/artifacts
      - key: DATABASE_URL
        fromDatabase:
          name: erpfusion-db
          property: connectionString
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: ERP_ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: erpfusion-db
    databaseName: erpfusion
    user: erpfusion
    plan: 0.5c-1g
    region: singapore
    diskSizeGB: 5
